name: deepdrr-cuda11
channels:
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - cuda-toolkit=11.8        # nvcc 同梱の公式メタパッケージ
  - pycuda                   # conda-forge のビルド済み (2025年時点で配布あり)
  - numpy
  - matplotlib
  - pip
  - pip:
      - deepdrr==1.1.3
      - nibabel
      - imageio
      - tqdm
      - pydicom
      - scikit-image